<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f5efe2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1f1d19" media="(prefers-color-scheme: dark)" />
    <script>
      try {
        var th = localStorage.getItem("growsafe:theme");
        if (th === "light" || th === "dark")
          document.documentElement.setAttribute("data-theme", th);
      } catch (e) {}
    </script>
    <meta name="description" content="GrowSafe: a free child-safety planner." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>GrowSafe</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
